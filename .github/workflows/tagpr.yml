name: tagpr
on:
  push:
    branches: ["main"]

permissions: {}

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Songmu/tagpr@242e22916eb775d6e359959fe3ba5c497de4a01a # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
