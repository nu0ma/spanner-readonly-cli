name: ci
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        # 1.7.12, pinned by digest
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  gosec:
    runs-on: ubuntu-latest
    env:
      # v2.29.0 cannot load Go 1.27.2 export data (securego/gosec#1771), so pin a master commit until the next release
      GOSEC_VERSION: 707f2271f66579a18e1da25794b1e8012247274b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        with:
          go-version-file: go.mod
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gosec-cache
        with:
          path: ~/go/bin/gosec
          key: gosec-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}-${{ env.GOSEC_VERSION }}
      - if: steps.gosec-cache.outputs.cache-hit != 'true'
        run: go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
      - run: gosec ./...

  readonly-guarantee:
    runs-on: ubuntu-latest
    env:
      OMNI_IMAGE: us-docker.pkg.dev/spanner-omni/images/spanner-omni:2026.r1-beta.2@sha256:115622065afefd267f9ef3ff1025e35d73a03f66a7335de8e051b393ebdcfacc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Spanner Omni
        run: |
          nohup docker run -d --name spanner-omni -p 15000-15026:15000-15026 \
            "$OMNI_IMAGE" start-single-server > "$RUNNER_TEMP/omni-start.log" 2>&1 &
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o spanner-readonly-cli .
      - name: Wait for Spanner Omni
        run: |
          for _ in $(seq 1 60); do
            if docker logs spanner-omni 2>&1 | grep -q "Spanner is ready"; then
              echo "Spanner Omni is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Spanner Omni did not become ready" >&2
          cat "$RUNNER_TEMP/omni-start.log" >&2
          docker logs spanner-omni >&2
          exit 1
      - name: Verify UPDATE/DELETE cannot be executed
        run: ./scripts/verify-readonly.sh

  test:
    runs-on: ubuntu-latest
    env:
      OMNI_IMAGE: us-docker.pkg.dev/spanner-omni/images/spanner-omni:2026.r1-beta.2@sha256:115622065afefd267f9ef3ff1025e35d73a03f66a7335de8e051b393ebdcfacc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Spanner Omni
        run: |
          nohup docker run -d --name spanner-omni -p 15000-15026:15000-15026 \
            "$OMNI_IMAGE" start-single-server > "$RUNNER_TEMP/omni-start.log" 2>&1 &
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Wait for Spanner Omni
        run: |
          for _ in $(seq 1 60); do
            if docker logs spanner-omni 2>&1 | grep -q "Spanner is ready"; then
              echo "Spanner Omni is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Spanner Omni did not become ready" >&2
          cat "$RUNNER_TEMP/omni-start.log" >&2
          docker logs spanner-omni >&2
          exit 1
      - name: Run tests (unit + E2E)
        run: go test -v ./...
        env:
          SPANNER_ENDPOINT: localhost:15000
